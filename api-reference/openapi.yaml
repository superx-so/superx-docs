          type: string
          nullable: true
        added_at:
          type: string
          format: date-time
          nullable: true

    BulkAddResult:
      type: object
      description: |
        Counters from a bulk member add. added + duplicates + failed equals the number of resolvable ids; not_found ids never reached the list.
        Members are inserted one at a time upstream, so a 502 or 503 can land after some of them were already added. Retrying the same request is safe: the list dedupes on (list, person), so anything that got in the first time comes back in `duplicates` rather than being added twice.
      properties:
        added:
          type: integer
          description: New members created.
        duplicates:
          type: integer
          description: Ids already in the list. Nothing was written for them.
        failed:
          type: integer
          description: Resolvable ids whose insert failed.
        not_found:
          type: array
          description: Submitted ids with no stored profile. Nothing was sent for them and no placeholder member was created; add these by handle instead.
          items:
            type: string
        total_in_list_after:
          type: integer
          description: Members in the list once the call finished.

    BulkRemoveResult:
      type: object
      properties:
        deleted:
          type: integer
          description: Members actually removed. Lower than the ids sent when some were not in this list.
        total_in_list_after:
          type: integer

