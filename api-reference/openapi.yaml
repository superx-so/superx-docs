openapi: 3.1.0
info:
  title: SuperX API
  version: "1.0.0"
  description: |
    The SuperX public API: your Twitter/X content, analytics, audience and
    scheduling data over REST.

    All endpoints require an API key (`Authorization: Bearer sxk_...`) except
    `GET /v1/docs`. Keys are created in the SuperX app under Account > API / MCP / CLI
    and are server-side secrets.

    Timestamps are UTC ISO-8601 in both directions; inputs must carry an explicit
    `Z` or numeric offset. Every authenticated response carries
    `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers.
  contact:
    name: SuperX
    url: https://superx.so
servers:
  - url: https://api.superx.so
security:
  - apiKey: []
tags:
  - name: Identity
  - name: Content
  - name: Analytics
  - name: Inspiration
  - name: Audience
  - name: Contact Lists
  - name: Signals
  - name: Media
  - name: Scheduling
  - name: Tags
  - name: Context
  - name: Articles
  - name: Meta

paths:
  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Get the key owner
      description: Returns the key owner, their plan, and the calling key's name and scopes.
      responses:
        "200":
          description: The authenticated identity.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Me"
              example:
                data:
                  owner:
                    id: "1178367350552305665"
                    name: "Jordan Rivers"
                    email: "jordan@example.com"
                  plan:
                    tier: 2
                    label: "Pro"
                    is_trial: false
                  key:
                    id: 3
                    name: "My script"
                    key_prefix: "sxk_Ab3dEf9h"
                    scopes: ["read", "write"]
                    created_at: "2026-07-01T09:15:00.000Z"
                    last_used_at: "2026-07-06T08:41:03.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/accounts:
    get:
      tags: [Identity]
      operationId: listAccounts
      summary: List your accounts
      description: |
        The accounts this key may act on: your main account plus any linked
        accounts. When linked accounts cannot be verified, the response degrades
        to the main account only and carries a top-level `degraded: true` flag;
        retry shortly for the full list.
      responses:
        "200":
          description: Main and linked accounts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  degraded:
                    type: boolean
                    description: Present and true only when linked accounts could not be verified and the list contains the main account only.
              example:
                data:
                  - id: "1178367350552305665"
                    username: "mainhandle"
                    name: "Main Account"
                    avatar_url: "https://pbs.twimg.com/profile_images/example.jpg"
                    is_main: true
                  - id: "1299139023923867648"
                    username: "brandhandle"
                    name: "Brand Account"
                    avatar_url: "https://pbs.twimg.com/profile_images/example2.jpg"
                    is_main: false
                pagination: { page: 1, limit: 2, has_more: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/posts:
    get:
      tags: [Content]
      operationId: listPosts
      summary: List published posts
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: type
          in: query
          description: Which posts to include.
          schema:
            type: string
            enum: [posts, replies, all]
            default: posts
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: sort
          in: query
          schema:
            type: string
            enum: [posted_at, likes, impressions]
            default: posted_at
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of posts, newest first by default.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1941123456789012345"
                    text: "Consistency beats intensity. Post every day for 30 days and watch what happens."
                    posted_at: "2026-07-05T14:02:11.000Z"
                    url: "https://x.com/mainhandle/status/1941123456789012345"
                    is_reply: false
                    in_reply_to_id: null
                    is_quote: false
                    thread_id: "1941123456789012345"
                    metrics:
                      likes: 231
                      replies: 18
                      reposts: 40
                      quotes: 3
                      bookmarks: 55
                      impressions: 48210
                pagination: { page: 1, limit: 20, has_more: true }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/posts/analytics:
    get:
      tags: [Analytics]
      operationId: getPostAnalytics
      summary: Get analytics
      description: |
        Totals and a per-day series (posts, engagement, impressions, follower
        samples) for the selected account. Default range is the last 30 days;
        the maximum range is 366 days.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: Totals, follower change and per-day series.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Analytics"
              example:
                data:
                  range:
                    since: "2026-06-06T00:00:00.000Z"
                    until: "2026-07-06T00:00:00.000Z"
                  totals:
                    posts: 92
                    likes: 4110
                    replies: 380
                    reposts: 512
                    quotes: 44
                    bookmarks: 903
                    impressions: 812400
                  followers:
                    start: 12180
                    end: 12544
                    change: 364
                  series:
                    - date: "2026-07-04"
                      posts: 3
                      likes: 140
                      replies: 12
                      reposts: 17
                      quotes: 1
                      bookmarks: 31
                      impressions: 27400
                      followers: 12520
                    - date: "2026-07-05"
                      posts: 4
                      likes: 231
                      replies: 18
                      reposts: 40
                      quotes: 3
                      bookmarks: 55
                      impressions: 48210
                      followers: 12544
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/replies:
    get:
      tags: [Content]
      operationId: listReplies
      summary: List replies you sent
      description: Replies the selected account has posted, newest first.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of replies.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1941200000000000001"
                    text: "Agreed. The first 100 posts are practice."
                    posted_at: "2026-07-05T16:20:00.000Z"
                    url: "https://x.com/mainhandle/status/1941200000000000001"
                    is_reply: true
                    in_reply_to_id: "1941199999999999999"
                    is_quote: false
                    thread_id: "1941199999999999999"
                    metrics:
                      likes: 12
                      replies: 1
                      reposts: 0
                      quotes: 0
                      bookmarks: 2
                      impressions: 1840
                pagination: { page: 1, limit: 20, has_more: false }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/replies/received:
    get:
      tags: [Audience]
      operationId: listReceivedReplies
      summary: List replies you received
      description: Every stored reply the selected account has received across all of its posts, with the replier's profile and the replied-to post when available.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, most_liked]
            default: recent
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of received replies.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReceivedReply" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1941300000000000002"
                    text: "This thread changed how I plan my week."
                    posted_at: "2026-07-03T10:12:45.000Z"
                    metrics: { likes: 9 }
                    author:
                      id: "944883311"
                      username: "replierhandle"
                      name: "Replier Name"
                      avatar_url: "https://pbs.twimg.com/profile_images/..."
                    in_reply_to:
                      id: "1941299999999999998"
                      text: "How I plan a content week in 20 minutes:"
                      posted_at: "2026-07-03T09:00:00.000Z"
                pagination: { page: 1, limit: 20, has_more: false, total: 14 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/inspiration:
    get:
      tags: [Inspiration]
      operationId: searchInspiration
      summary: Search the inspiration library
      description: |
        Search a library of 50M+ real high-performing posts by topic. Use the
        results for structures, hooks and angles to remix, never to copy.

        The library is user-level, so there is no `account_id` parameter.
        Results are intentionally varied: the same query returns a different
        mix on each call. Pagination is heuristic; `has_more` means a full
        page came back with library pages left (pages run 1 to 7).

        Each result carries an `outlier_score`: the post's engagement rate vs
        the expected rate for its author's follower tier, x10 (10 = expected,
        higher = overperformed). Null when the author's follower count is
        unknown.
      parameters:
        - name: q
          in: query
          required: true
          description: Topic or theme to search for (1-200 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevant, recent, likes, reposts, impressions, outlier]
            default: relevant
        - name: min_likes
          in: query
          description: Only posts with at least this many likes.
          schema: { type: integer, minimum: 0 }
        - name: min_reposts
          in: query
          description: Only posts with at least this many reposts.
          schema: { type: integer, minimum: 0 }
        - name: min_replies
          in: query
          description: Only posts with at least this many replies.
          schema: { type: integer, minimum: 0 }
        - name: min_bookmarks
          in: query
          description: Only posts with at least this many bookmarks.
          schema: { type: integer, minimum: 0 }
        - name: min_impressions
          in: query
          description: Only posts with at least this many impressions.
          schema: { type: integer, minimum: 0 }
        - name: min_length
          in: query
          description: Only posts with at least this many characters.
          schema: { type: integer, minimum: 0 }
        - name: min_followers
          in: query
          description: Only posts from authors with at least this many followers.
          schema: { type: integer, minimum: 0 }
        - name: max_followers
          in: query
          description: Only posts from authors with at most this many followers.
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: lang
          in: query
          description: Language code.
          schema:
            type: string
            default: en
        - name: exclude_topics
          in: query
          description: Comma-separated topics to exclude (keyword filter).
          schema:
            type: string
            example: "crypto,politics"
        - name: limit
          in: query
          description: Page size, 1 to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: page
          in: query
          description: 1-based page number, 1 to 7.
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 1
      responses:
        "200":
          description: A page of matching posts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InspirationPost" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1938765432109876543"
                    text: "I built my first product in 30 days with zero audience. Here is exactly what I would do differently:"
                    posted_at: "2026-06-20T15:04:00.000Z"
                    lang: "en"
                    likes: 4211
                    replies: 312
                    reposts: 388
                    bookmarks: 1904
                    impressions: 512000
                    outlier_score: 14.2
                    author:
                      handle: "buildersam"
                      name: "Sam Fields"
                      followers: 8421
                      verified: true
                pagination: { page: 1, limit: 20, has_more: true }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/contacts:
    get:
      tags: [Audience]
      operationId: listContacts
      summary: List engaged contacts
      description: People who engaged with the selected account over the moving 90-day window, with reply and repost tallies.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: sort
          in: query
          schema:
            type: string
            enum: [engagement, replies, reposts]
            default: engagement
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of contacts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "44196397001234567"
                    username: "activefan"
                    name: "Sam Porter"
                    avatar_url: "https://pbs.twimg.com/profile_images/example3.jpg"
                    replies_90d: 14
                    reposts_90d: 6
                pagination: { page: 1, limit: 20, has_more: true, total: 181 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/contacts/{id}/replies:
    get:
      tags: [Audience]
      operationId: listContactReplies
      summary: List one contact's replies to you
      description: The stored reply history from one contact to the selected account, with the replied-to post when available.
      parameters:
        - name: id
          in: path
          required: true
          description: The contact's id from `GET /v1/contacts`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, most_liked]
            default: recent
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of the contact's replies.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactReply" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1941300000000000002"
                    text: "This thread changed how I plan my week."
                    posted_at: "2026-07-03T10:12:45.000Z"
                    metrics: { likes: 9 }
                    in_reply_to:
                      id: "1941299999999999998"
                      text: "How I plan a content week in 20 minutes:"
                      posted_at: "2026-07-03T09:00:00.000Z"
                pagination: { page: 1, limit: 20, has_more: false, total: 14 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/contact-lists:
    get:
      tags: [Contact Lists]
      operationId: listContactLists
      summary: List contact lists
      description: |
        The selected account's contact lists: system lists first (Followers,
        Following, Repliers, Reposters; `is_system: true` with a `kind`), then
        lists you created, newest first. System lists are read-only and
        index-only: their members are not readable through the API and
        `member_count` is 0 for them.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's contact lists.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactList" }
              example:
                data:
                  - id: "sys_f1a2b3c4d5e6f7g8h9i0j"
                    name: "Followers"
                    is_system: true
                    kind: "followers"
                    member_count: 0
                    created_at: "2026-05-01T09:00:00.000Z"
                    updated_at: "2026-05-01T09:00:00.000Z"
                  - id: "k1l2m3n4o5p6q7r8s9t0u"
                    name: "Founder prospects"
                    is_system: false
                    kind: null
                    member_count: 42
                    created_at: "2026-06-20T14:30:00.000Z"
                    updated_at: "2026-07-01T08:15:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members:
    get:
      tags: [Contact Lists]
      operationId: listContactListMembers
      summary: List contact list members
      description: |
        Members of one contact list you created. Includes a 90-day
        `engaged_count` (replies + reposts to the account) per member.
        System lists return 400 `system_list_not_supported`.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
        - name: q
          in: query
          description: Filter members by handle or name substring.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of list members.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactListMember" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "m1a2b3c4d5e6f7g8h9i0j"
                    x_user_id: "944883311"
                    username: "founderhandle"
                    name: "Founder Name"
                    avatar_url: "https://pbs.twimg.com/profile_images/..."
                    location: "Austin, TX"
                    followers_count: 12800
                    following_count: 640
                    engaged_count: 7
                    source: "manual"
                    added_at: "2026-06-25T11:00:00.000Z"
                pagination: { page: 1, limit: 20, has_more: true, total: 42 }
        "400": { $ref: "#/components/responses/SystemListNotSupported" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Contact Lists]
      operationId: addContactListMember
      summary: Add a contact list member
      description: |
        Add a person to a list you created, by `handle` (live profile lookup)
        or by `x_user_id` (numeric X user id already known to SuperX).
        Exactly one of the two. Naturally idempotent: adding someone already
        in the list returns 200 with the existing member and
        `duplicate: true`, and writes nothing. Main account only; needs the
        write scope. No `Idempotency-Key` support (none is needed).

        Counts against a separate live-contact-enrichment rate limit (varies
        by plan), in addition to the normal write limits.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  description: X username, with or without the @.
                x_user_id:
                  type: string
                  description: Numeric X user id.
            examples:
              byHandle:
                value: { handle: "founderhandle" }
              byId:
                value: { x_user_id: "944883311" }
      responses:
        "201":
          description: The member was added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AddedContactListMember" }
              example:
                data:
                  id: "m1a2b3c4d5e6f7g8h9i0j"
                  x_user_id: "944883311"
                  username: "founderhandle"
                  name: "Founder Name"
                  avatar_url: "https://pbs.twimg.com/profile_images/..."
                  added_at: "2026-07-08T10:00:00.000Z"
        "200":
          description: Already a member; nothing changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AddedContactListMember" }
                  duplicate:
                    type: boolean
              example:
                data:
                  id: "m1a2b3c4d5e6f7g8h9i0j"
                  x_user_id: "944883311"
                  username: "founderhandle"
                  name: "Founder Name"
                  avatar_url: "https://pbs.twimg.com/profile_images/..."
                  added_at: "2026-06-25T11:00:00.000Z"
                duplicate: true
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListOrUserNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/{memberId}:
