                  updated_at: "2026-09-06T10:05:00.000Z"
                  created_by:
                    x_user_id: "44196397"
                    username: "yourhandle"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/NoteNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [Audience]
      operationId: deleteContactNote
      summary: Delete a note on a contact
      description: |
        Returns 204 with no body. Deleting an already-deleted note, or a note
        belonging to another contact, returns 404 `note_not_found`. That is
        the only check - deleting works on any id the account already has a
        note on, whether or not that person is still one of its contacts.
        Works for
        your main account or any account linked to it; accounts shared with you
        are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The person's numeric X user id.
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          description: The note id from `GET /v1/contacts/{id}/notes`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The note was deleted.
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/NoteNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

