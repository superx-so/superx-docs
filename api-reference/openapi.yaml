        posted_at:
          type: string
          format: date-time
          nullable: true
        metrics:
          type: object
          properties:
            likes:
              type: integer
        in_reply_to:
          type: object
          nullable: true
          properties:
            id:
              type: string
            text:
              type: string
            posted_at:
              type: string
              format: date-time
              nullable: true

    ReceivedReply:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        posted_at:
          type: string
          format: date-time
          nullable: true
        metrics:
          type: object
          properties:
            likes:
              type: integer
        author:
          type: object
          description: The replier. Profile fields are null when no stored profile exists.
          properties:
            id:
              type: string
            username:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            avatar_url:
              type: string
              nullable: true
        in_reply_to:
          type: object
          nullable: true
          properties:
            id:
              type: string
            text:
              type: string
            posted_at:
              type: string
              format: date-time
              nullable: true

    ContactList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        is_system:
          type: boolean
        kind:
          type: string
          nullable: true
          enum: [followers, following, repliers, reposters, null]
          description: Set on system lists only.
        member_count:
          type: integer
          description: Members in the list. Always 0 for system lists (their membership is maintained automatically and is not exposed here).
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ContactListMember:
      type: object
      properties:
        id:
          type: string
          description: The membership id used by the remove endpoint.
        x_user_id:
          type: string
        username:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        followers_count:
          type: integer
          nullable: true
        following_count:
          type: integer
          nullable: true
        engaged_count:
          type: integer
          description: Replies + reposts to the account in the last 90 days.
        source:
          type: string
          nullable: true
          description: How the member entered the list (for example manual).
        added_at:
          type: string
          format: date-time
          nullable: true

    AddedContactListMember:
      type: object
      description: Compact member shape returned by the add endpoint.
      properties:
        id:
          type: string
        x_user_id:
          type: string
        username:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        added_at:
          type: string
          format: date-time
          nullable: true

    SignalAgentSignal:
      type: object
      description: One watched signal on an agent. Which fields are set depends on the type (handle/name/avatar for profile and follower watches, query for keyword watches, list_name for list watches).
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [profile_watch, follower_watch, keyword_watch, list_watch]
        handle:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        query:
          type: string
          nullable: true
        list_name:
          type: string
          nullable: true
        status:
          type: string
        status_detail:
          type: string
          nullable: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    SignalAgent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          description: active, paused, or error.
        status_detail:
          type: string
          nullable: true
        icp_description:
          type: string
          description: The ideal customer profile the agent scores people against.
        precision_mode:
          type: string
          enum: [high, discovery]
        destination_list_id:
          type: string
          nullable: true
          description: The contact list deposits go to; joins to `GET /v1/contact-lists`.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        deposited_count:
          type: integer
          description: Leads already saved to the destination list.
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: The most recent signal run across the agent's signals.
        signals:
          type: array
          items: { $ref: "#/components/schemas/SignalAgentSignal" }

    SignalLead:
      type: object
      properties:
        id:
          type: integer
        agent:
          type: object
          description: The agent that found this lead, with its current status.
          properties:
            id:
              type: integer
            name:
              type: string
            status:
              type: string
        user:
          type: object
          description: The lead's stored profile. Profile fields are null when no snapshot is stored; the lead is still returned.
          properties:
            x_user_id:
              type: string
              nullable: true
            username:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            avatar_url:
              type: string
              nullable: true
            followers_count:
              type: integer
              nullable: true
            following_count:
              type: integer
              nullable: true
            location:
              type: string
              nullable: true
        icp_score:
          type: integer
          nullable: true
          description: How strongly the person matched the agent's ideal customer profile.
        icp_rationale:
          type: string
          nullable: true
        deposited:
          type: boolean
          description: Whether the lead has been saved to the agent's contact list yet.
        deposited_at:
          type: string
          format: date-time
          nullable: true
        discovered_at:
          type: string
          format: date-time
          nullable: true
        provenance:
          type: object
          nullable: true
          description: How the lead was discovered. Null when no provenance is stored.
          properties:
            type:
              type: string
              nullable: true
            action:
              type: string
              nullable: true
            source_ref:
              type: string
              nullable: true
            tweet_id:
              type: string
              nullable: true
            tweet_text:
              type: string
              nullable: true
            target_handle:
              type: string
              nullable: true

    ScheduledPost:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [draft, scheduled, sent, error]
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: Null for drafts.
        parts:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              media:
                type: array
                description: Present only when the part carries media.
                items:
                  type: object
                  properties:
                    object_key:
                      type: string
                      description: Re-use this on PATCH to keep the attachment.
                    url:
                      type: string
                    file_type:
                      type: string
                    size:
                      type: integer
                      nullable: true
                    alt_text:
                      type: string
                      nullable: true
        title:
          type: string
          nullable: true
          description: Draft title shown in the SuperX app. Never posted.
        scratchpad:
          type: string
          nullable: true
          description: Private working notes. Never posted.
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              color:
                type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        auto_retweet:
          type: object
          nullable: true
          description: Applied auto-retweet setting; null when off.
          properties:
            after_hours:
              type: integer
              nullable: true
            remove_after_hours:
              type: integer
              nullable: true
        auto_delete:
          type: object
          nullable: true
          description: Applied auto-delete setting; null when off.
          properties:
            after_hours:
              type: integer
              nullable: true
            threshold:
              type: integer
              nullable: true
        auto_plug:
          type: object
          nullable: true
          description: Applied auto-plug setting; null when off.
          properties:
            template_id:
              type: string
              nullable: true
            threshold:
              type: integer
              nullable: true
        auto_dm:
          type: object
          nullable: true
          description: Applied Auto DM setting (inherit-only, read-only); null when off. The DM text stays in the SuperX app.
          properties:
            enabled:
              type: boolean
            max_dms:
              type: integer
              nullable: true
            batch_mode:
              type: boolean
            triggers:
              type: object
              properties:
                reply:
                  type: boolean
                retweet:
                  type: boolean
        super_followers_only:
          type: boolean

    PlugTemplate:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        has_media:
          type: boolean
          description: True when the template replies with media attached.

    Context:
      type: object
      description: >-
        The account's Context settings - the background SuperX's AI uses when
        writing for the account. `style_guide.generated` is read-only.
      properties:
        profile_description:
          type: object
          properties:
            text: { type: string }
            enabled: { type: boolean }
        interests:
          type: array
          items: { type: string }
        rules:
          type: string
          description: Mandatory instructions applied on every AI surface.
        reply:
          type: object
          properties:
            custom_instructions: { type: string }
            include_author_name: { type: boolean }
        voice:
          type: object
          properties:
            favorite_creators:
              type: array
              items: { $ref: "#/components/schemas/FavoriteCreator" }
            use_own_posts_as_examples: { type: boolean }
        style_guide:
          type: object
          properties:
            audience_override:
              type: string
              nullable: true
              description: Manual override; outranks the generated guide until cleared.
            vocabulary_override:
              type: string
              nullable: true
            generated:
              type: object
              description: The app-generated style guide (read-only).
              properties:
                audience: { type: string, nullable: true }
                vocabulary: { type: string, nullable: true }
                generated_at: { type: string, format: date-time, nullable: true }
        products:
          type: array
          items: { $ref: "#/components/schemas/ContextProduct" }

    FavoriteCreator:
      type: object
      properties:
        screen_name:
          type: string
        id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        profile_image_url_https:
          type: string
          nullable: true

    ContextProduct:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        positioning:
          type: string
          nullable: true
        features:
          type: string
          nullable: true
        updates:
          type: string
          nullable: true
        last_scraped_at:
          type: string
          format: date-time
          nullable: true
          description: When SuperX last refreshed the product's details from its url (read-only).
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Palette color name rendered by the SuperX app (for example rose, amber, blue, violet).
        created_at:
          type: string
          format: date-time
          nullable: true

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed]
        content_markdown:
          type: string
          description: The article body as markdown. Present on single-article responses only, never in lists.
        cover:
          type: object
          nullable: true
          properties:
            url:
              type: string
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        x_post_id:
          type: string
          nullable: true
          description: The X post id once published.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Null in list responses.
        updated_at:
          type: string
          format: date-time
          nullable: true

  responses:
    InvalidParameter:
      description: A parameter is missing, malformed, or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_parameter
              message: "since must be a UTC ISO-8601 timestamp"

    Unauthorized:
      description: Missing/malformed Authorization header (`unauthorized`) or an unknown/revoked key (`invalid_api_key`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_api_key
              message: "Unknown or revoked API key"

    SubscriptionRequired:
      description: |
        Subscription lapsed. NOTE the legacy body shape: `error` is a plain
        string here, not the `{ code, message }` object. Read-only keys on
        write endpoints instead get the object envelope with code
        `insufficient_scope`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
              - $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: "subscription_required: The SuperX API requires an active subscription"

    WriteForbidden:
      description: Read-only key (`insufficient_scope`), linked account (`writes_main_account_only`), or a lapsed subscription (legacy string envelope).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: insufficient_scope
              message: "This API key is read-only. Create a key with the write scope to use this endpoint."

    ArticleNotFound:
      description: No article with that id belongs to this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: not_found
              message: "No article with that id belongs to this account."

    AccountNotFound:
      description: account_id is not one of your accounts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: account_not_found
              message: "No account with that id belongs to this key"

    ListNotFound:
      description: No contact list with that id belongs to this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: list_not_found
              message: "No contact list with that id belongs to this account."

    ListOrUserNotFound:
      description: The list id is not one of your lists (`list_not_found`), or the handle did not match an X account (`user_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: user_not_found
              message: "No X account matches that handle."

    MemberNotFound:
      description: The list id is not one of your lists (`list_not_found`), or the member id is not in that list (`member_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: member_not_found
              message: "No member with that id belongs to this list."

    ProductNotFound:
      description: No product with that id belongs to this account (`not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: not_found
              message: "No product with that id belongs to this account."

    AgentNotFound:
      description: The agent_id is not one of your signal agents (`agent_not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: agent_not_found
              message: "No signal agent with that agent_id belongs to this account."

    SystemListReadOnly:
      description: Member add/remove on a system list (`system_list_read_only`), or a malformed body (`invalid_parameter`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: system_list_read_only
              message: "System lists are managed automatically and can't be edited."

    SystemListNotSupported:
      description: Member reads on a system list are not supported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: system_list_not_supported
              message: "System list members can't be read through the API. Use a list you created instead."

    RateLimited:
      description: Rate limit exceeded (limits vary by plan). Honor Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: rate_limited
              message: "Rate limit exceeded for the Pro plan (30 requests/min). Upgrade for higher limits."
              retry_after: 42

    InternalError:
      description: Unexpected server error. May also use the legacy string envelope when subscription verification fails.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: internal_error
              message: "Failed to fetch posts"

    UpstreamError:
      description: A dependent SuperX service returned an unexpected response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: upstream_error
              message: "Failed to fetch scheduled posts. Try again shortly."

    UpstreamUnavailable:
      description: The scheduling service is temporarily unreachable. Safe to retry; reuse your Idempotency-Key on POST.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: upstream_unavailable
              message: "The scheduling service is temporarily unavailable. Retry with the same Idempotency-Key."

    AccountsUnavailable:
      description: Linked-account verification is temporarily unavailable (fail closed). The main account keeps working.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: accounts_unavailable
              message: "Account information is temporarily unavailable. Try again shortly."
