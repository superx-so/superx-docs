          type: string
          nullable: true

    ContextProduct:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        positioning:
          type: string
          nullable: true
        features:
          type: string
          nullable: true
        updates:
          type: string
          nullable: true
        last_scraped_at:
          type: string
          format: date-time
          nullable: true
          description: When SuperX last refreshed the product's details from its url (read-only).
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Palette color name rendered by the SuperX app (for example rose, amber, blue, violet).
        created_at:
          type: string
          format: date-time
          nullable: true

    QueueSlot:
      type: object
      required: [time, days]
      properties:
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time in the account's queue timezone, `HH:MM`.
          example: "09:00"
        days:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Weekdays this slot runs on, 0 = Sunday. Sorted ascending on read; duplicates are deduped on write.
          example: [1, 3, 5]

    QueueSettings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone the slot times run in.
        timezone_is_default:
          type: boolean
          description: True when the account has never set a timezone and SuperX is using its default (UTC).
        slots:
          type: array
          items: { $ref: "#/components/schemas/QueueSlot" }
          description: The predefined posting slots, sorted by time.
        slots_are_default:
          type: boolean
          description: True when the account has never set a schedule and SuperX is using its default slots. A stored empty list is explicit and reports false.
        slot_count:
          type: integer
          description: Total number of time and day pairs across all slots.

    ReflowSummary:
      type: object
      description: What changing the slots did to the already-queued posts.
      properties:
        moved:
          type: integer
          description: Queued posts retimed onto the new slots.
        skipped:
          type: integer
          description: Posts that published or were deleted while the reflow ran; nothing was lost.
        bailed:
          type: boolean
          description: >-
            True when the settings were saved but the queue was deliberately
            left untouched (a post had nowhere to land, or the move set was
            too large). Retrying the same request is safe.

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed]
        content_markdown:
          type: string
          description: The article body as markdown. Present on single-article responses only, never in lists.
        cover:
          type: object
          nullable: true
          properties:
            url:
              type: string
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        x_post_id:
          type: string
          nullable: true
          description: The X post id once published.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Null in list responses.
        updated_at:
          type: string
          format: date-time
          nullable: true

  responses:
    InvalidParameter:
      description: A parameter is missing, malformed, or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_parameter
              message: "since must be a UTC ISO-8601 timestamp"

    Unauthorized:
      description: Missing/malformed Authorization header (`unauthorized`) or an unknown/revoked key (`invalid_api_key`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_api_key
              message: "Unknown or revoked API key"

    SubscriptionRequired:
      description: |
        Subscription lapsed. NOTE the legacy body shape: `error` is a plain
        string here, not the `{ code, message }` object. Read-only keys on
        write endpoints instead get the object envelope with code
        `insufficient_scope`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
              - $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: "subscription_required: The SuperX API requires an active subscription"

    WriteForbidden:
      description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), or a lapsed subscription (legacy string envelope).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: insufficient_scope
              message: "This API key is read-only. Create a key with the write scope to use this endpoint."

    ContextWriteForbidden:
      description: >-
        Read-only key (`insufficient_scope`), an account shared with you with
        `editor` permission (`editor_restricted` - only the owner can change
        context settings; queue settings stay editable), or a lapsed
        subscription (legacy string envelope). Context writes are per-account
        and never return `writes_main_account_only`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: editor_restricted
              message: "This account is shared with you with Editor permission. Only the account owner can change these settings."

    QueueWriteForbidden:
      description: >-
        Read-only key (`insufficient_scope`) or a lapsed subscription (legacy
        string envelope). Queue settings are a per-account write that any
        linked or shared account can use, Editor-permission shares included,
        so `writes_main_account_only` and `editor_restricted` never apply
        here.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: insufficient_scope
              message: "This API key is read-only. Create a key with the write scope to use this endpoint."

    ArticleNotFound:
      description: No article with that id belongs to this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: not_found
              message: "No article with that id belongs to this account."

    AccountNotFound:
      description: account_id is not one of your accounts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: account_not_found
              message: "No account with that id belongs to this key"

    ContactNotFound:
      description: That id is not one of the account's known contacts (`contact_not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: contact_not_found
              message: "No contact with that id belongs to this account. Contacts are the account's engagers, contact-list members and signal leads."

    NoteNotFound:
      description: No note with that id belongs to this contact (`note_not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: note_not_found
              message: "No note with that id belongs to this contact."

    ListNotFound:
      description: No contact list with that id belongs to this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: list_not_found
              message: "No contact list with that id belongs to this account."

    ListOrUserNotFound:
      description: The list id is not one of your lists (`list_not_found`), or the handle did not match an X account (`user_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: user_not_found
              message: "No X account matches that handle."

    MemberNotFound:
      description: The list id is not one of your lists (`list_not_found`), or the member id is not in that list (`member_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: member_not_found
              message: "No member with that id belongs to this list."

    ProductNotFound:
      description: No product with that id belongs to this account (`not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: not_found
              message: "No product with that id belongs to this account."

    AgentNotFound:
      description: The agent_id is not one of your signal agents (`agent_not_found`), or account_id is not one of your accounts (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: agent_not_found
              message: "No signal agent with that agent_id belongs to this account."

    SystemListReadOnly:
      description: A write against a system list (`system_list_read_only`) - renaming or deleting one, or adding/removing its members, singly or in bulk - or a malformed body (`invalid_parameter`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: system_list_read_only
              message: "System lists are managed automatically and can't be edited."

    SystemListNotSupported:
      description: Member reads on a system list are not supported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: system_list_not_supported
              message: "System list members can't be read through the API. Use a list you created instead."

    RateLimited:
      description: Rate limit exceeded (limits vary by plan). Honor Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: rate_limited
              message: "Rate limit exceeded for the Pro plan (30 requests/min). Upgrade for higher limits."
              retry_after: 42

    FeedNotFound:
      description: >-
        The feed id is not one of your Engage feeds (`feed_not_found`), the
        feed points at a contact list that no longer exists
        (`list_not_found`), or account_id is not one of your accounts
        (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: feed_not_found
              message: "No Engage feed with that id belongs to this account."

    FeedRateLimited:
      description: >-
        The plan's feed-fetch allowance is spent, or feed fetches are busy
        across all API users right now. Honor Retry-After. No feed units are
        charged when the request is rejected; the request still consumed one
        unit of the ordinary read budget, and the X-RateLimit-* headers on
        this response describe that read bucket, not the feed bucket.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: rate_limited
              message: "Rate limit exceeded for the Pro plan (5 feed fetches/min). Upgrade for higher limits. A list feed that rotates its members costs 3 fetches. Retry after 27 seconds."
              retry_after: 27
              remaining_day: 41

    InternalError:
      description: Unexpected server error. May also use the legacy string envelope when subscription verification fails.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: internal_error
              message: "Failed to fetch posts"

    UpstreamError:
      description: A dependent SuperX service returned an unexpected response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: upstream_error
              message: "Failed to fetch scheduled posts. Try again shortly."

    UpstreamUnavailable:
      description: The scheduling service is temporarily unreachable. Safe to retry; reuse your Idempotency-Key on POST.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: upstream_unavailable
              message: "The scheduling service is temporarily unavailable. Retry with the same Idempotency-Key."

    AccountsUnavailable:
      description: Linked-account verification is temporarily unavailable (fail closed). The main account keeps working.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: accounts_unavailable
              message: "Account information is temporarily unavailable. Try again shortly."
