  /v1/context:
    get:
      tags: [Context]
      operationId: getContext
      summary: Get context settings
      description: >-
        The account's Context settings in one document: the background
        SuperX's AI uses when writing for the account. `profile_description`
        grounds the voice and personalizes the daily content mix and search;
        `interests` are the highest-priority content topics; `rules` are
        mandatory instructions on every AI surface; `reply` steers generated
        replies; `voice.favorite_creators` (max 3) inspire the writing style;
        `style_guide` holds the manual overrides plus the read-only generated
        guide; `products` (max 5) are mentioned naturally in generated
        content.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The context document.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Context" }
              example:
                data:
                  profile_description:
                    text: "Indie hacker building SuperX, an X growth platform."
                    enabled: true
                  interests: ["indie hacking", "SaaS", "AI agents"]
                  rules: "Never use hashtags. Keep posts under 200 characters."
                  reply:
                    custom_instructions: "Be helpful, never salesy."
                    include_author_name: false
                  voice:
                    favorite_creators:
                      - screen_name: "levelsio"
                        id: "1577241624"
                        name: "Pieter Levels"
                        profile_image_url_https: "https://pbs.twimg.com/profile_images/example.jpg"
                    use_own_posts_as_examples: true
                  style_guide:
                    audience_override: null
                    vocabulary_override: null
                    generated:
                      audience: "Bootstrapped SaaS founders and indie hackers."
                      vocabulary: "Plain, direct, numbers-first."
                      generated_at: "2026-07-20T09:00:00.000Z"
                  products:
                    - id: 3
                      url: "https://superx.so"
                      name: "SuperX"
                      description: "X growth platform"
                      positioning: null
                      features: null
                      updates: null
                      last_scraped_at: "2026-07-25T12:00:00.000Z"
                      created_at: "2026-07-01T09:00:00.000Z"
                      updated_at: "2026-07-25T12:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    patch:
      tags: [Context]
      operationId: updateContext
      summary: Update context settings
      description: >-
        Edit any subset of the Context settings; only the fields you send
        change. Strings accept `null` to clear (style-guide overrides then
        revert to the generated guide). Arrays fully REPLACE the stored list:
        send every value the account should keep, `[]` clears.
        `voice.favorite_creators` takes X usernames (with or without @, as
        bare strings or as the { screen_name } objects GET returns); SuperX
        resolves names and avatars. Unlike most write endpoints, context
        writes accept `account_id` for any linked or shared account; on a
        share with `editor` permission they return `403 editor_restricted`,
        because only the account owner may change what the AI knows. These
        settings shape all future AI output for the account. Returns the full
        updated document.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_description:
                  type: object
                  properties:
                    text:
                      type: string
                      maxLength: 500
                      nullable: true
                    enabled:
                      type: boolean
                interests:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 50
                rules:
                  type: string
                  maxLength: 500
                  nullable: true
                reply:
                  type: object
                  properties:
                    custom_instructions:
                      type: string
                      maxLength: 500
                      nullable: true
                    include_author_name:
                      type: boolean
                voice:
                  type: object
                  properties:
                    favorite_creators:
                      type: array
                      maxItems: 3
                      items:
                        oneOf:
                          - type: string
                            description: X username, with or without the leading @.
                          - type: object
                            required: [screen_name]
                            properties:
                              screen_name: { type: string }
                            description: GET output round-trips; fields other than screen_name are ignored and re-derived.
                    use_own_posts_as_examples:
                      type: boolean
                style_guide:
                  type: object
                  properties:
                    audience_override:
                      type: string
                      maxLength: 600
                      nullable: true
                    vocabulary_override:
                      type: string
                      maxLength: 1000
                      nullable: true
                account_id:
                  type: string
            example:
              rules: "Never use hashtags. Keep posts under 200 characters."
              interests: ["indie hacking", "SaaS", "AI agents"]
              style_guide:
                audience_override: null
      responses:
        "200":
          description: >-
            The full updated context document. If the save landed but the
            read-back failed, `data` is null and `note` says to fetch
            GET /v1/context for the updated document.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Context"
                      - type: "null"
                  note:
                    type: string
                    description: Present only when data is null (save succeeded, read-back failed).
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ContextWriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/context/products:
    put:
      tags: [Context]
      operationId: setContextProducts
      summary: Replace the product list
      description: >-
        Reconciles the account's products to exactly the submitted list (max
        5). CAUTION: this is a FULL REPLACE by url - any existing product
        whose url is missing from the payload is removed. To edit one product
        without touching the others, use PATCH /v1/context/products/{id}.
        Removal is reversible: re-adding the same url restores the product
        with its scraped details intact. Fields are written only when
        present; `null` clears a field.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        maxLength: 2048
                        description: http(s) product url; the upsert key.
                      name: { type: string, maxLength: 200, nullable: true }
                      description: { type: string, maxLength: 1000, nullable: true }
                      positioning: { type: string, maxLength: 2000, nullable: true }
                      features: { type: string, maxLength: 2000, nullable: true }
                      updates: { type: string, maxLength: 2000, nullable: true }
                account_id:
                  type: string
            example:
              products:
                - url: "https://superx.so"
                  name: "SuperX"
                  description: "X growth platform"
      responses:
        "200":
          description: The full product list after the reconcile.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContextProduct" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ContextWriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/context/products/{id}:
    patch:
      tags: [Context]
      operationId: updateContextProduct
      summary: Add or edit one product
      description: >-
        Edits one product without touching the others. `{id}` is either a
        numeric product id (from GET /v1/context) or a URL-encoded product
        url. By url the call upserts: it edits the product with that url or
        creates it when it does not exist yet (cap 5) - this is the
        single-product create path. Only the fields you send change; `null`
        clears a field.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Numeric product id, or a URL-encoded http(s) product url.
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200, nullable: true }
                description: { type: string, maxLength: 1000, nullable: true }
                positioning: { type: string, maxLength: 2000, nullable: true }
                features: { type: string, maxLength: 2000, nullable: true }
                updates: { type: string, maxLength: 2000, nullable: true }
                account_id: { type: string }
            example:
              updates: "Shipped the public API"
      responses:
        "200":
          description: The saved product.
          headers:
