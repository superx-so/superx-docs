                    items: { type: string }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [Articles]
      operationId: deleteArticle
      summary: Delete an article
      description: Deletes the article. Scheduled articles refund the quota their scheduling deducted. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Deleted. No body.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/articles/{id}/publish:
    post:
      tags: [Articles]
      operationId: publishArticle
      summary: Publish an article to X now
      description: |
        Publishes the article immediately from its STORED title, body, and cover. Irreversible: the article goes live publicly and post quota is spent. Requires X Premium on the connected account; without it the publish fails with 403 `x_premium_required`. X also enforces its own article limits (10 drafts and 5 publishes per day), which surface as 502 `x_publish_failed` with the failure detail.

        Supports `Idempotency-Key`, strongly recommended. A 504 `upstream_timeout` is AMBIGUOUS: the publish may still have completed; GET the article and check its status before retrying.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: string }
      responses:
        "200":
          description: Published.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [published] }
                      post_id: { type: string, nullable: true }
                      url: { type: string, nullable: true }
                      published_at: { type: string, format: date-time, nullable: true }
              example:
                data:
                  id: "k9GdPzR4wq2xVbY0nT1sc"
                  status: "published"
                  post_id: "1790000000000000000"
                  url: "https://x.com/i/status/1790000000000000000"
                  published_at: "2026-07-07T12:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: Post quota exceeded for the current billing period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: post_quota_exceeded
                  message: "Post quota exceeded for the current billing period."
        "403":
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), missing X Premium (`x_premium_required`), a connected account needing re-authorization (`reauth_required`), or a lapsed subscription.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: x_premium_required
                  message: "Publishing articles requires X Premium on the connected account."
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "409":
          description: The article's status does not allow publishing (already published, or a publish is in flight).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: article_not_editable
                  message: "This article is already published"
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: The publish failed (`x_publish_failed`, article returned to draft, quota refunded) or could not be confirmed (`x_publish_ambiguous`, check the article's status).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: x_publish_failed
                  message: "The publish failed. The article was returned to draft."
        "504":
          description: AMBIGUOUS timeout. The publish may still have completed. GET the article to check its status before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: upstream_timeout
                  message: "The publish did not respond in time and may still have completed. GET the article to check its status before retrying."

  /v1/articles/{id}/schedule:
    post:
      tags: [Articles]
      operationId: scheduleArticle
      summary: Schedule or reschedule an article
      description: |
        Schedules the article for `scheduled_for` (UTC ISO-8601 with an explicit Z or offset, more than 2 minutes in the future; no maximum horizon). Scheduling a draft deducts post quota, refunded on unschedule or delete. Rescheduling an already scheduled article is a free time-only move. Supports `Idempotency-Key`. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_for]
              properties:
                scheduled_for:
                  type: string
                  format: date-time
                account_id: { type: string }
            example:
              scheduled_for: "2026-08-01T15:00:00Z"
      responses:
        "200":
          description: The scheduled article.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: Post quota exceeded for the current billing period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: post_quota_exceeded
                  message: "Post quota exceeded for the current billing period."
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "409":
          description: The article's status does not allow scheduling (already published or publishing), or the Idempotency-Key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: article_not_editable
                  message: "This article is already published"
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/articles/{id}/unschedule:
    post:
      tags: [Articles]
      operationId: unscheduleArticle
      summary: Unschedule an article
      description: Pulls a scheduled article back to draft and refunds exactly the quota its scheduling deducted. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: string }
      responses:
        "200":
          description: The article, back in draft.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "409":
          description: The article is not scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: article_not_scheduled
                  message: "Only scheduled articles can be unscheduled."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/articles/{id}/cover:
    post:
      tags: [Articles]
      operationId: generateArticleCover
      summary: Generate an AI cover image
      description: |
        Generates a 2.5:1 cover image from the article's TITLE (a title is required) and, by default, attaches it as the article's cover. `attach: false` generates without touching the current cover; attach later via PATCH `cover_url`. `style_text` (max 8000 chars) steers the artwork.

        Slow (60-100 seconds) and paid: spends AI credits (about 25 per generation) against daily and monthly caps, all enforced server-side. Cap 429s carry `remaining_day` / `remaining_month` / `limit_day` / `limit_month`; a credit 429 carries `credits_required` / `credits_remaining` / `reset_at`. Supports `Idempotency-Key`, recommended. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                style_text:
                  type: string
                  maxLength: 8000
                  description: Optional style description steering the artwork.
                attach:
                  type: boolean
                  default: true
                account_id: { type: string }
            example:
              style_text: "dark, minimal, geometric"
      responses:
        "200":
          description: The generated cover.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cover:
                        type: object
                        properties:
                          url: { type: string }
                      attached:
                        type: boolean
                        description: Whether the cover was attached to the article.
                      remaining_day: { type: integer, nullable: true }
                      remaining_month: { type: integer, nullable: true }
              example:
                data:
                  cover: { url: "https://media.superx.so/covers/example.jpg" }
                  attached: true
                  remaining_day: 3
                  remaining_month: 11
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), cover generation disabled (`feature_disabled`), or a lapsed subscription.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "404": { $ref: "#/components/responses/ArticleNotFound" }
        "409":
          description: A cover is already being generated for this article (`cover_gen_in_progress`), or the Idempotency-Key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: cover_gen_in_progress
                  message: "A cover is already being generated for this article. Try again once it finishes."
        "429":
          description: Rate limited, generation caps reached (`cover_gen_cap_daily` / `cover_gen_cap_monthly` with counters), or AI credits exhausted (`ai_credits_exhausted`, with the credit counters and `Retry-After`).
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreditExhaustedError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                cap_reached:
                  summary: Daily generation cap
                  value:
                    error:
                      code: cover_gen_cap_daily
                      message: "The daily cover generation cap has been reached."
                      remaining_day: 0
                      remaining_month: 7
                      limit_day: 6
                      limit_month: 13
                credits_exhausted:
                  summary: Credit pool empty
                  value:
                    error:
                      code: ai_credits_exhausted
                      message: "Not enough AI credits for a cover generation."
                      credits_required: 25
                      credits_remaining: 4
                      reset_at: 1790812800
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504":
          description: AMBIGUOUS timeout. The render may still have completed. GET the article to check its cover before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: upstream_timeout
                  message: "Cover generation did not respond in time and may still have completed. GET the article to check its cover before retrying."

  /v1/docs:
    get:
      tags: [Meta]
      operationId: getDocs
      summary: Machine-readable quickstart
      description: A short markdown quickstart (auth header, base URL, endpoint list, rate limits). No authentication required.
      security: []
      responses:
        "200":
          description: The quickstart document.
          content:
            text/markdown:
              schema:
                type: string
              example: |
                # SuperX API v1 quickstart

                Base URL: `https://api.superx.so/v1`
                ...

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A SuperX API key ("sxk_..."), created in the SuperX app under Account > API / MCP / CLI. Keys are server-side secrets.

  headers:
    X-RateLimit-Limit:
      description: The limit of the rate window closest to exhaustion.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in that window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp (seconds) when that window resets.
      schema:
        type: integer
    X-Credits-Charged:
      description: >-
        AI credits kept for this call. Sent where the endpoint knows the final
        number (post drafts); cover generation settles to its measured cost
        after answering and sends the other two headers only.
      schema:
        type: integer
    X-Credits-Remaining:
      description: AI credits left in the account's pool, bonus credits included.
      schema:
        type: integer
    X-Credits-Reset:
      description: Unix timestamp (seconds) when the AI credit pool refills.
      schema:
        type: integer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Unique key (max 64 characters) for safe retries. Replays carry the
        "Idempotency-Replayed" response header set to "true". Keys are
        retained for 24 hours.
      schema:
        type: string
        maxLength: 64

    AccountId:
      name: account_id
      in: query
      required: false
      description: Account to act on, from `GET /v1/accounts`. Defaults to your main account. An id outside your accounts returns `404 account_not_found`.
      schema:
        type: string
    Since:
      name: since
      in: query
      required: false
      description: UTC ISO-8601 lower bound (explicit Z or offset required).
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      required: false
      description: UTC ISO-8601 upper bound (explicit Z or offset required).
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
            retry_after:
              type: integer
              description: Seconds to wait before retrying (rate-limit errors only).

    CreditExhaustedError:
      type: object
      required: [error]
      description: |
        The `429 ai_credits_exhausted` body: the standard envelope plus the
        credit counters. Sent with a `Retry-After` header and the
        `X-Credits-Remaining` / `X-Credits-Reset` headers. `code` is stable;
        the counters are additive fields, safe to ignore.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [ai_credits_exhausted]
            message:
              type: string
            credits_required:
              type: integer
              description: Credits the call needed.
            credits_remaining:
              type: integer
              nullable: true
              description: Credits available when it was refused.
            reset_at:
              type: integer
              nullable: true
              description: Unix timestamp (seconds) when the pool refills.

    ActionLimitedError:
      type: object
      required: [error]
      description: |
        The `429 ai_action_limited` body: a per-day cap on how many times one
        expensive action can run on your plan, counted separately from the
        credit pool and from the request rate limits. Sent with a
        `Retry-After` header. The cap resets at midnight UTC. No plan
        currently caps post drafts, so this is a shape to code against rather
        than one you will meet today.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [ai_action_limited]
            message:
              type: string
            retry_after:
              type: integer
              description: Seconds to wait before the cap resets.

    LegacyErrorEnvelope:
      type: object
      required: [error]
      description: |
        Legacy shape used ONLY by the shared subscription middleware: a plain
        string `error` field. Seen on `403` when the subscription has lapsed
        (string starts with "subscription_required:") and on `500` when
        subscription verification fails (string starts with "internal_error:").
      properties:
        error:
          type: string
          example: "subscription_required: The SuperX API requires an active subscription"

    Pagination:
      type: object
      required: [page, limit, has_more]
      properties:
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
          description: Present only where cheap to compute.

    Account:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        is_main:
          type: boolean
        shared:
          type: boolean
          description: True when this account was shared with you by its owner (manual share or team share) rather than owned by you.
        permission:
          type: string
          enum: [full, editor]
          description: What you may change on this account. Your own accounts are always `full`. On an `editor` share you can change queue settings but not context settings.

    Me:
      type: object
      properties:
        owner:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        plan:
          type: object
          nullable: true
          properties:
            tier:
              type: integer
            label:
              type: string
            is_trial:
              type: boolean
        key:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            key_prefix:
              type: string
            scopes:
              type: array
              items:
                type: string
                enum: [read, write]
            created_at:
              type: string
              format: date-time
              nullable: true
            last_used_at:
              type: string
              format: date-time
              nullable: true
        credits:
          type: object
          nullable: true
          description: >-
            The AI credit pool the paid endpoints draw from, or null when it
            cannot be read. One credit is one cent of measured model spend.
          properties:
            remaining:
              type: integer
              description: Credits left, bonus credits included.
            pool:
              type: integer
              description: Size of the plan's pool for the current period.
            period:
              type: string
              enum: [month, day]
              description: Paid plans refill monthly; trials refill daily.
            period_end:
              type: string
              format: date-time
              nullable: true
              description: When the pool refills.
            bonus:
              type: integer
              description: Bonus credits, spent before the pool.

    PostMetrics:
      type: object
      properties:
        likes:
          type: integer
        replies:
          type: integer
        reposts:
          type: integer
        quotes:
          type: integer
        bookmarks:
          type: integer
        impressions:
          type: integer

    Post:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        posted_at:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
        is_reply:
          type: boolean
        in_reply_to_id:
          type: string
          nullable: true
        is_quote:
          type: boolean
        thread_id:
          type: string
          nullable: true
        metrics:
          $ref: "#/components/schemas/PostMetrics"

    Analytics:
      type: object
      properties:
        range:
          type: object
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        followers:
          type: object
          properties:
            start:
              type: integer
              nullable: true
            end:
              type: integer
              nullable: true
            change:
              type: integer
              nullable: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDay"

    AnalyticsTotals:
      type: object
      properties:
        posts:
          type: integer
        likes:
          type: integer
        replies:
          type: integer
        reposts:
          type: integer
        quotes:
          type: integer
        bookmarks:
          type: integer
        impressions:
          type: integer

    AnalyticsDay:
      allOf:
        - $ref: "#/components/schemas/AnalyticsTotals"
        - type: object
          properties:
            date:
              type: string
              description: UTC day, YYYY-MM-DD.
            followers:
              type: integer
              nullable: true
              description: Follower sample for the day, when tracked.

    InspirationPost:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: Link to the post on X.
        text:
          type: string
        posted_at:
          type: string
          format: date-time
          nullable: true
        lang:
          type: string
          nullable: true
        likes:
          type: integer
        replies:
          type: integer
        reposts:
