  /v1/queue-settings:
    get:
      tags: [Queue]
      operationId: getQueueSettings
      summary: Get queue settings
      description: >-
        The account's posting schedule: the predefined time slots the queue
        fills and the timezone they run in (the Edit Queue modal in the
        SuperX app). `slots` are `{ time, days }` entries with 0 = Sunday,
        sorted by time; `slot_count` is the total number of time and day
        pairs. `timezone_is_default` and `slots_are_default` are true when
        the account has never set that value and SuperX is using its own
        default. Works for your main account, a linked account, or an account
        shared with you.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The queue settings.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueSettings" }
              example:
                data:
                  timezone: "Europe/London"
                  timezone_is_default: false
                  slots:
                    - time: "09:00"
                      days: [1, 2, 3, 4, 5]
                    - time: "17:30"
                      days: [1, 3, 5]
                  slots_are_default: false
                  slot_count: 8
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    patch:
      tags: [Queue]
      operationId: updateQueueSettings
      summary: Update queue settings
      description: >-
        Changes the account's posting schedule. Send `slots`, `timezone`, or
        both; only what you send changes. `slots` is a FULL REPLACE (max 50
        entries, one per unique time, each with at least one weekday, 0 =
        Sunday); `[]` clears every predefined slot and leaves the queue
        all-custom.


        Changing `slots` also RE-FLOWS the queue the way the app does: a
        queued post sitting exactly on an occurrence of an old slot moves to
        the matching new occurrence (Nth old to Nth new), so deliberate gaps
        are preserved and hand-picked custom times stay put. Scheduled X
        Articles and chained quote posts never move. Changing only `timezone`
        never moves posts.


        `reflow.bailed: true` means the settings were saved but the queue was
        deliberately left untouched (a post had nowhere to land, or the move
        set was too large); the response then carries a `note`. Retrying the
        same request is safe and idempotent.


        Changing the timezone and the slots in one call usually moves nothing,
        because the existing posts were placed under the old timezone; to
        re-flow them, change the timezone first, then send the slots in a
        second call.


        This is a per-account write: pass `account_id` for any linked or
        shared account. Editor-permission shares CAN change queue settings.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/QueueSlot" }
                  description: Full replace of the predefined posting slots. `[]` clears them all.
                timezone:
                  type: string
                  maxLength: 64
                  description: IANA timezone name the slot times run in, for example `Europe/London`.
                account_id: { type: string }
            example:
              slots:
                - time: "09:00"
                  days: [1, 2, 3, 4, 5]
                - time: "17:30"
                  days: [1, 3, 5]
              timezone: "Europe/London"
      responses:
        "200":
          description: The updated settings plus what the reflow did.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueSettings" }
                  reflow: { $ref: "#/components/schemas/ReflowSummary" }
                  note:
                    type: string
                    description: Present only when `reflow.bailed` is true.
              example:
                data:
                  timezone: "Europe/London"
                  timezone_is_default: false
                  slots:
                    - time: "09:00"
                      days: [1, 2, 3, 4, 5]
                    - time: "17:30"
                      days: [1, 3, 5]
                  slots_are_default: false
                  slot_count: 8
                reflow:
                  moved: 3
                  skipped: 0
                  bailed: false
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/QueueWriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags
      description: Tags organize drafts and scheduled posts. They are scoped to the workspace owner and shared across linked accounts. Sorted by name A-Z.
      responses:
        "200":
          description: All tags.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
              example:
                data:
                  - id: "aB3xWnA0kLpR7sVtYu3zc"
                    name: "Launch week"
                    color: "amber"
                    created_at: "2026-07-01T09:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      description: Names are unique per workspace. `color` is a palette name the SuperX app renders (rose, amber, lime, emerald, teal, cyan, blue, indigo, violet, fuchsia, slate, stone); it defaults to `blue`. Tags are workspace-wide, so this is a main-account write and any other `account_id` returns `403 writes_main_account_only`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                color:
                  type: string
                  minLength: 1
                  maxLength: 32
                  default: blue
                account_id:
                  type: string
                  description: Only your main account (the default when omitted). Tags are workspace-wide, so any other account you own returns `403 writes_main_account_only`.
            example:
              name: "Launch week"
              color: "amber"
      responses:
        "201":
          description: The created tag.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tag" }
              example:
                data:
                  id: "aB3xWnA0kLpR7sVtYu3zc"
                  name: "Launch week"
                  color: "amber"
                  created_at: "2026-07-07T09:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Read-only key (`insufficient_scope`), an `account_id` other than your main account (`writes_main_account_only`; tags are workspace-wide), or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "409":
          description: A tag with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: duplicate_name
                  message: "A tag with that name already exists."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

