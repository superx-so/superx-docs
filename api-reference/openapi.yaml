          in: path
          required: true
          description: The person's numeric X user id.
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          description: The note id from `GET /v1/contacts/{id}/notes`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
                account_id:
                  type: string
            example:
              body: "Demo booked for 12 September."
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ContactNote" }
