        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                account_id:
                  type: string
            example:
              name: "Founder prospects Q4"
      responses:
        "200":
          description: The updated list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ContactList" }
              example:
                data:
                  id: "k1l2m3n4o5p6q7r8s9t0u"
                  name: "Founder prospects Q4"
                  is_system: false
                  kind: null
                  member_count: 42
                  created_at: "2026-06-20T14:30:00.000Z"
                  updated_at: "2026-09-06T10:05:00.000Z"
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [Contact Lists]
      operationId: deleteContactList
      summary: Delete a contact list
      description: |
        Delete a list you created, and with it its membership. The people
        themselves are untouched, but a signal agent depositing into this list
        stops until it is repointed in the SuperX app. Returns 204 with no
        body; a second delete returns 404 `list_not_found`. System lists return
        400 `system_list_read_only`.

        Works for your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The list was deleted.
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members:
    get:
      tags: [Contact Lists]
      operationId: listContactListMembers
      summary: List contact list members
      description: |
        Members of one contact list you created. Includes a 90-day
        `engaged_count` (replies + reposts to the account) per member.
        System lists return 400 `system_list_not_supported`.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
        - name: q
          in: query
          description: Filter members by handle or name substring.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of list members.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactListMember" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "m1a2b3c4d5e6f7g8h9i0j"
                    x_user_id: "944883311"
                    username: "founderhandle"
                    name: "Founder Name"
                    avatar_url: "https://pbs.twimg.com/profile_images/..."
                    location: "Austin, TX"
                    followers_count: 12800
                    following_count: 640
                    engaged_count: 7
                    source: "manual"
                    added_at: "2026-06-25T11:00:00.000Z"
                pagination: { page: 1, limit: 20, has_more: true, total: 42 }
        "400": { $ref: "#/components/responses/SystemListNotSupported" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Contact Lists]
      operationId: addContactListMember
      summary: Add a contact list member
      description: |
        Add a person to a list you created, by `handle` (live profile lookup)
        or by `x_user_id` (numeric X user id already known to SuperX).
        Exactly one of the two. Naturally idempotent: adding someone already
        in the list returns 200 with the existing member and
        `duplicate: true`, and writes nothing. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
        Needs the write scope. No `Idempotency-Key` support (none is
        needed).

        Counts against a separate live-contact-enrichment rate limit (varies
        by plan), in addition to the normal write limits.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
                  description: X username, with or without the @.
                x_user_id:
                  type: string
                  description: Numeric X user id.
            examples:
              byHandle:
                value: { handle: "founderhandle" }
              byId:
                value: { x_user_id: "944883311" }
      responses:
        "201":
          description: The member was added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AddedContactListMember" }
              example:
                data:
                  id: "m1a2b3c4d5e6f7g8h9i0j"
                  x_user_id: "944883311"
                  username: "founderhandle"
                  name: "Founder Name"
                  avatar_url: "https://pbs.twimg.com/profile_images/..."
                  added_at: "2026-07-08T10:00:00.000Z"
        "200":
          description: Already a member; nothing changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AddedContactListMember" }
                  duplicate:
                    type: boolean
              example:
                data:
                  id: "m1a2b3c4d5e6f7g8h9i0j"
                  x_user_id: "944883311"
                  username: "founderhandle"
                  name: "Founder Name"
                  avatar_url: "https://pbs.twimg.com/profile_images/..."
                  added_at: "2026-06-25T11:00:00.000Z"
                duplicate: true
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListOrUserNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/{memberId}:
    delete:
      tags: [Contact Lists]
      operationId: removeContactListMember
      summary: Remove a contact list member
      description: |
        Remove a member from a list you created. Returns 204 with no body.
        Removing an already-removed member returns 404 `member_not_found`.
        Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
        Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          description: The member id from `GET /v1/contact-lists/{id}/members`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: The member was removed.
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/bulk:
    post:
      tags: [Contact Lists]
      operationId: addContactListMembers
      summary: Add contact list members in bulk
      description: |
        Add up to 500 people to a list you created, by numeric X user id.

        This endpoint does NO live profile lookup, which is why it costs one
        write and no enrichment: it builds each member from the profile SuperX
        already stores. Ids SuperX has never seen come back in `not_found` and
        are NOT added, so no placeholder members are ever created. Add those
        one at a time with `POST /v1/contact-lists/{id}/members` and a
        `handle`, which does resolve live (and costs one enrichment unit).

        Re-adding an existing member is counted in `duplicates`, never an
        error. Duplicate ids inside one call are collapsed. System lists return
        400 `system_list_read_only`.

        Works for your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x_user_ids]
              properties:
                x_user_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: Numeric X user ids.
                account_id:
                  type: string
            example:
              x_user_ids: ["944883311", "44196397", "1234567890"]
      responses:
        "200":
          description: The bulk add finished. Read the counters for what happened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BulkAddResult" }
              example:
                data:
                  added: 2
                  duplicates: 0
                  failed: 0
                  not_found: ["1234567890"]
                  total_in_list_after: 44
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/bulk-delete:
    post:
      tags: [Contact Lists]
      operationId: removeContactListMembers
      summary: Remove contact list members in bulk
      description: |
        Remove up to 500 members from a list you created, by member id (the
        `id` from `GET /v1/contact-lists/{id}/members`).

        POST rather than DELETE because the ids travel in a body. The delete is
        scoped to this list, so ids that are not in it are skipped and
        `deleted` can be lower than the number you sent. There is deliberately
        no "delete everything matching a filter" mode. System lists return 400
        `system_list_read_only`.

        Works for your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: Member ids from `GET /v1/contact-lists/{id}/members`.
                account_id:
                  type: string
            example:
              member_ids: ["m1a2b3c4d5e6f7g8h9i0j", "m2b3c4d5e6f7g8h9i0j1k"]
      responses:
        "200":
          description: The bulk removal finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BulkRemoveResult" }
              example:
                data:
                  deleted: 2
                  total_in_list_after: 42
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents:
    get:
      tags: [Signals]
      operationId: listSignalAgents
      summary: List signal agents
      description: |
        The account's signal agents: the automated lead finders from the
        SuperX app. Each agent watches one or more signals (profiles,
        followers, keywords, or lists) and scores the people it finds
        against its ideal customer profile. Agents can be created, paused,
        resumed, and deleted through the API; name, ICP, precision, and
        destination edits happen in the SuperX app. `destination_list_id`
        joins to `GET /v1/contact-lists` for the target list's name. Not
        paginated (agent counts are capped per account).
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's signal agents.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SignalAgent" }
              example:
                data:
                  - id: 3
                    name: "Founder prospects"
                    status: active
                    status_detail: null
                    icp_description: "Early-stage SaaS founders posting about growth"
                    precision_mode: high
                    destination_list_id: "contact:V1StGXR8_Z5jdHi6B-myT"
                    created_at: "2026-06-20T09:00:00.000Z"
                    updated_at: "2026-07-01T18:30:00.000Z"
                    deposited_count: 42
                    last_checked: "2026-07-08T06:15:00.000Z"
                    signals:
                      - id: 7
                        type: profile_watch
                        handle: "naval"
                        name: "Naval"
                        avatar: "https://pbs.twimg.com/profile_images/..."
                        query: null
                        list_name: null
                        status: active
                        status_detail: null
                        last_run_at: "2026-07-08T06:15:00.000Z"
                        created_at: "2026-06-20T09:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

    post:
      tags: [Signals]
      operationId: createSignalAgent
      summary: Create a signal agent
      description: |
        Create a signal agent: it watches X for the given keywords and scores
        the people it finds against `icp_description`. Matching leads land in
        Signals (and `GET /v1/signals/leads`) over the following minutes and
        days; nothing is returned synchronously.

        Omit `keywords` and 1-3 watches are suggested from the ICP (if
        suggestion fails, nothing is created and you get 502
        `upstream_error`). Omit `destination_list_id` and a contact list
        named `Leads: <agent name>` is created for the leads, flagged
        `destination_list_created: true` in the response.

        Plan limits apply (403 `cap_reached`). Supports `Idempotency-Key`
        (max 64 chars): retries with the same key and body replay the
        original response with `Idempotency-Replayed: true`. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icp_description]
              properties:
                name:
                  type: string
                  maxLength: 80
                  description: Agent name shown in SuperX.
                icp_description:
                  type: string
                  maxLength: 500
                  description: Who the ideal leads are; found people are scored against this.
                precision_mode:
                  type: string
                  enum: [high, discovery]
                  default: high
                  description: high = fewer, stricter matches; discovery = broader net.
                keywords:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    maxLength: 180
                  description: Plain-language descriptions of what the target customer posts about. Omit to auto-suggest from the ICP. Keywords beyond your plan's per-agent signal limit are dropped; the response lists the signals actually created.
                destination_list_id:
                  type: string
                  description: Contact list id (from `GET /v1/contact-lists`) that receives the leads. Omit to auto-create one.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              name: "Build in public founders"
              icp_description: "Indie founders building SaaS in public, sharing MRR and launch updates"
              precision_mode: high
              keywords: ["building in public", "just shipped my MVP"]
      responses:
        "201":
          description: The created agent with its keyword signals, plus whether a destination list was auto-created.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Idempotency-Replayed:
              description: Present and "true" when this response was replayed from a previous request with the same Idempotency-Key.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SignalAgent"
                      - type: object
                        properties:
                          destination_list_created:
                            type: boolean
                            description: true when destination_list_id was omitted and a list was created for the agent.
              example:
                data:
                  id: 12
                  name: "Build in public founders"
                  status: active
                  status_detail: null
                  icp_description: "Indie founders building SaaS in public, sharing MRR and launch updates"
                  precision_mode: high
                  destination_list_id: "contact:V1StGXR8_Z5jdHi6B-myT"
                  created_at: "2026-07-08T10:00:00.000Z"
                  updated_at: "2026-07-08T10:00:00.000Z"
                  deposited_count: 0
                  last_checked: null
                  signals:
                    - id: 31
                      type: keyword_watch
                      handle: null
                      name: null
                      avatar: null
                      query: "building in public"
                      list_name: null
                      status: active
                      status_detail: null
                      last_run_at: null
                      created_at: "2026-07-08T10:00:00.000Z"
                  destination_list_created: true
        "400":
          description: A parameter is missing, malformed, or out of range (`invalid_parameter`), or the create was rejected upstream (`invalid_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: invalid_parameter
                  message: "icp_description is required (1-500 characters)"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), lapsed subscription (legacy string envelope), or the plan's agent limit is reached (`cap_reached`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: cap_reached
                  message: "You've reached your plan's signal agent limit (1 on the pro plan). Pause and delete an agent, or upgrade your plan."
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: idempotency_key_reuse
                  message: "This Idempotency-Key was already used with a different request body."
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents/{id}:
    patch:
      tags: [Signals]
      operationId: setSignalAgentStatus
      summary: Pause or resume a signal agent
      description: |
        Status-only lifecycle: `active` or `paused`. Paused agents stop
        finding leads; resuming picks up where the agent left off (a resume
        is rejected with `invalid_request` when the agent's destination list
        is gone; point it at a new list in the SuperX app first). Other
        fields (name, ICP, precision, destination) are edited in the SuperX
        app. Naturally idempotent, so there is no `Idempotency-Key` support.
        Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, paused]
            example:
              status: paused
      responses:
        "200":
          description: The updated agent.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SignalAgent" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AgentNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

    delete:
      tags: [Signals]
      operationId: deleteSignalAgent
      summary: Delete a signal agent
      description: |
        Delete an agent. The leads it already saved and its destination
        contact list stay untouched. Deleting the same id again returns 404
        `agent_not_found`. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The agent was deleted.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      deleted:
                        type: boolean
              example:
                data:
                  id: 12
                  deleted: true
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AgentNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/leads:
    get:
      tags: [Signals]
      operationId: listSignalLeads
      summary: List signal leads
      description: |
        The leads the account's signal agents have found, newest first:
        people who matched an agent's ideal customer profile, with their
        profile, the match score and rationale, whether the lead has been
        saved to the agent's contact list yet (`deposited`/`deposited_at`),
        and provenance describing how the lead was discovered. Leads under
        paused or errored agents remain listed (the agent's status is on
        every row).
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: agent_id
          in: query
          description: Narrow to one agent by its numeric id (from `GET /v1/signals/agents`). An unknown or foreign id returns 404 `agent_not_found`.
          schema:
            type: integer
        - name: deposited
          in: query
          description: true returns only leads already saved to the agent's contact list; false returns only new ones. Omit for both.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: limit
          in: query
          description: Items per page, up to 100. Default 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of leads, discovered_at descending.
          headers:
