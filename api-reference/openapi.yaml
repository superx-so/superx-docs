      description: |
        Replace one note's body. The note must belong to the contact in the
        path: a note id from another contact returns 404 `note_not_found`.
        That is the only check - editing works on any id the account already
        has a note on, whether or not that person is still one of its
        contacts.
        Works for your main account or any account linked to it; accounts
